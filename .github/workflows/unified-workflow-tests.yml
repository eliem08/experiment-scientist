name: unified-workflow-tests

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unified-workflow-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test runner
        run: python -m pip install --upgrade pytest
      - name: Test workflow orchestration and optional adapters
        run: python -m pytest -q tests/test_unified_evaluation.py tests/test_optional_tool_adapters.py
