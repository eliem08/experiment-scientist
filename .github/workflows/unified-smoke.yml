name: unified-evaluation-smoke

on:
  pull_request:
  workflow_dispatch:
    inputs:
      model_id:
        description: "Small Hugging Face causal LM used for an actual CPU inference smoke run"
        required: true
        default: "sshleifer/tiny-gpt2"
        type: string
      max_new_tokens:
        description: "Maximum generated tokens per evaluator call"
        required: true
        default: "24"
        type: string

permissions:
  contents: read

concurrency:
  group: unified-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          path: experiment-scientist
      - uses: actions/checkout@v5
        with:
          repository: eliem08/behavior-bench
          path: behavior-bench
      - uses: actions/checkout@v5
        with:
          repository: eliem08/safety-probe-lab
          path: safety-probe-lab
      - uses: actions/checkout@v5
        with:
          repository: eliem08/steering-studio
          path: steering-studio
      - uses: actions/checkout@v5
        with:
          repository: eliem08/neural-flight-school
          path: neural-flight-school
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: experiment-scientist/requirements-evaluation.txt
      - name: Install runtime dependencies
        run: python -m pip install -r experiment-scientist/requirements-evaluation.txt
      - name: Run five runnable tools (integration smoke; quality gate reported separately)
        id: evaluation
        continue-on-error: true
        env:
          MODEL_ID: ${{ inputs.model_id || 'sshleifer/tiny-gpt2' }}
          MAX_NEW_TOKENS: ${{ inputs.max_new_tokens || '24' }}
        run: |
          python experiment-scientist/unified_evaluation.py \
            --behavior-bench-dir "$GITHUB_WORKSPACE/behavior-bench" \
            --safety-probe-dir "$GITHUB_WORKSPACE/safety-probe-lab" \
            --experiment-scientist-dir "$GITHUB_WORKSPACE/experiment-scientist" \
            --steering-studio-dir "$GITHUB_WORKSPACE/steering-studio" \
            --neural-flight-school-dir "$GITHUB_WORKSPACE/neural-flight-school" \
            --steering-layer 1 \
            --model-id "$MODEL_ID" \
            --device cpu \
            --max-new-tokens "$MAX_NEW_TOKENS" \
            --timeout-seconds 1200 \
            --output "$GITHUB_WORKSPACE/unified-smoke-output"
      - name: Validate that all five runnable stages actually executed
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report_path = Path("unified-smoke-output/workflow.json")
          if not report_path.is_file():
              raise SystemExit("Unified workflow did not produce workflow.json")
          report = json.loads(report_path.read_text(encoding="utf-8"))
          stages = report.get("stages", [])
          expected = {"behavior-bench", "safety-probe-lab", "experiment-scientist", "steering-studio", "neural-flight-school"}
          actual = {item.get("name") for item in stages}
          if actual != expected:
              raise SystemExit(f"Unexpected stage set: {actual}")
          failed = [item for item in stages if item.get("status") != "completed"]
          if failed:
              details = "; ".join(f"{item.get('name')}: {item.get('error', item.get('status'))}" for item in failed)
              raise SystemExit("One or more real inference stages failed: " + details)
          print(f"All {len(stages)} runnable stages completed for model {report.get('model_id')}.")
          print(f"Workflow quality gate passed: {report.get('quality_gate', {}).get('passed')}")
          PY
      - name: Summarize execution and behavioral quality gate separately
        if: always()
        env:
          EVALUATION_OUTCOME: ${{ steps.evaluation.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path("unified-smoke-output/workflow.json")
          summary_path = os.environ["GITHUB_STEP_SUMMARY"]
          expected = {
              "behavior-bench",
              "safety-probe-lab",
              "experiment-scientist",
              "steering-studio",
              "neural-flight-school",
          }
          if not report_path.is_file():
              text = (
                  "## Unified evaluation smoke\n\n"
                  "- **Execution smoke:** FAIL — workflow.json was not produced.\n"
                  "- **Behavioral quality gate:** unavailable.\n"
                  f"- **Orchestrator process:** {os.environ.get('EVALUATION_OUTCOME', 'unknown')}\n"
              )
              Path(summary_path).write_text(text, encoding="utf-8")
              print("::error::Unified workflow report is missing; inspect the evaluator logs.")
              raise SystemExit(0)

          report = json.loads(report_path.read_text(encoding="utf-8"))
          stages = report.get("stages", [])
          actual = {item.get("name") for item in stages}
          failed = [item for item in stages if item.get("status") != "completed"]
          execution_passed = actual == expected and not failed
          quality_passed = report.get("quality_gate", {}).get("passed") is True
          blockers = report.get("quality_gate", {}).get("blockers", [])

          lines = [
              "## Unified evaluation smoke",
              "",
              f"- **Execution smoke:** {'PASS' if execution_passed else 'FAIL'} "
              f"({len(stages)}/{len(expected)} expected stages completed).",
              f"- **Behavioral quality gate:** {'PASS' if quality_passed else 'FAIL'}.",
              f"- **Model:** `{report.get('model_id', 'unknown')}` on "
              f"`{report.get('device', 'unknown')}`.",
              f"- **Orchestrator process outcome:** `{os.environ.get('EVALUATION_OUTCOME', 'unknown')}`.",
          ]
          if blockers:
              lines.append(f"- **Quality-gate blockers:** {', '.join(blockers)}.")
          if failed:
              lines.append("- **Failed stages:** " + ", ".join(
                  f"{item.get('name', 'unknown')} ({item.get('status', 'unknown')})"
                  for item in failed
              ) + ".")
          lines += [
              "",
              "> A green integration-smoke job proves that configured stages executed and produced artifacts; "
              "it does not imply the model passed the behavioral quality gate or is safe/correct.",
              "",
          ]
          Path(summary_path).write_text("\n".join(lines), encoding="utf-8")
          if not execution_passed:
              print("::error::One or more integration smoke checks failed.")
          if not quality_passed:
              print("::warning::Behavioral quality gate failed; see workflow.json and Behavior Bench results.")
          print("\n".join(lines))
          PY
      - name: Upload workflow report, logs, and evaluator artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: unified-evaluation-smoke-${{ github.run_id }}
          path: |
            unified-smoke-output/
            behavior-bench/outputs/
            safety-probe-lab/outputs/
            steering-studio/outputs/
            neural-flight-school/outputs/
            experiment-scientist/outputs/
          if-no-files-found: warn
          retention-days: 14
